# TICKET-H R1(2026-09-02):相簿要能對 StackChan 照片按「永久收藏」與「刪除」,
# 而且要雙向同步到實體檔——那就必然需要寫入權。
#
# backend 的沙箱是 ProtectSystem=strict,原本只開 ReadWritePaths=/root/chatnest-next/data,
# 所以 /srv/mumu-server 對它是唯讀的(以 root 跑也一樣,systemd 的掛載擋在前面)。
# 這是刻意的最小權限設計,不是漏設。
#
# 這裡把寫入權擴大到「photos 這一個子目錄」而不是整個 /srv/mumu-server:
# 功能需要的就只有搬 pending/ ↔ saved/ 與刪檔,其他(brain.py、憑證、config.yaml)
# 維持唯讀。
[Service]
ReadWritePaths=/srv/mumu-server/photos
