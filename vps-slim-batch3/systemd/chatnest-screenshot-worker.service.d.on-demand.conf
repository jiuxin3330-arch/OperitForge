# 第三批 ②(2026-09-06):worker 改按需啟動。
#
# 之前:開機常駐、每 15 秒打一次 backend、無頭 chromium 一直開著
#       (平常 82MB、尖峰 508MB),而 8/07 起 25 天只用了 6 次。
# 現在:backend 派 job 時立觸發檔 → chatnest-screenshot-worker.path 拉起本服務
#       → 跑完 queue、空閒 60 秒後 exit 0。閒置時沒有 node 也沒有 chromium。
#
# ExecStartPre 把觸發檔收掉:PathExists 是「狀態」不是「事件」,收掉才能讓
# 下一次派 job 重新觸發;而 worker 執行中若又有新 job,backend 會再把它立起來,
# 本服務退出後 .path 立刻再拉一次,不會漏。
#
# Restart 從 on-failure 改 no:按需模式下,啟動即失敗(例如 backend 正在重啟)
# 會變成每 3 秒重試一次的迴圈。失敗就讓它失敗,30 分鐘的安全網 timer 會再撿。
#
# 回滾:rm 這個 drop-in 與 chatnest-screenshot-worker.path,
#      systemctl daemon-reload && systemctl enable --now chatnest-screenshot-worker
[Unit]
Description=ChatNest Next preview screenshot worker (on-demand)

[Service]
ExecStartPre=/bin/rm -f /srv/chatnest-next/data/screenshot-trigger/pending
ReadWritePaths=/srv/chatnest-next/data/screenshot-trigger
Restart=no
